name: Update backfield data

on:
  schedule:
    # Times are UTC; Arizona is UTC-7. GitHub often starts scheduled runs late,
    # so each update morning tries three times. A run with nothing new commits nothing.
    # Tuesday: full stats after Monday Night Football. Friday: final injury reports.
    - cron: '17 12 * * 2,5'   # 5:17am Arizona
    - cron: '17 14 * * 2,5'   # 7:17am
    - cron: '17 16 * * 2,5'   # 9:17am
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/backfields.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update backfield data"
            git push
          fi
